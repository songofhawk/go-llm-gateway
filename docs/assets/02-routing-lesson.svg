<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" role="img" aria-labelledby="title desc">
<title id="title">第 2 课的模型路由</title><desc id="desc">客户端传入 economy，网关在主组内轮转选择 A 或 B。允许重试的失败先尝试组内其他候选，候选用尽再走备用组。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52697e"/></marker></defs>
<g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#203247">
<g fill="#edf4fa" stroke="#8496ab"><rect x="10" y="90" width="155" height="65" rx="8"/><rect x="210" y="90" width="155" height="65" rx="8"/><rect x="415" y="20" width="190" height="65" rx="8"/><rect x="415" y="160" width="190" height="65" rx="8"/><rect x="650" y="90" width="140" height="65" rx="8"/></g>
<text x="87" y="115">客户端</text><text x="87" y="140">model=economy</text><text x="287" y="115">主候选组</text><text x="287" y="140">同组轮转</text><text x="510" y="46">primary-a</text><text x="510" y="71">demo-small</text><text x="510" y="186">primary-b</text><text x="510" y="211">demo-small</text><text x="720" y="115">备用组</text><text x="720" y="140">backup</text>
<g fill="none" stroke="#52697e" stroke-width="2" marker-end="url(#arrow)"><path d="M165 122H210"/><path d="M365 112L415 52"/><path d="M365 132L415 192"/><path d="M605 52L650 100" stroke-dasharray="5 4"/><path d="M605 192L650 145" stroke-dasharray="5 4"/></g>
<text x="715" y="58" font-size="13">允许重试且主组耗尽</text><text x="400" y="248" font-size="13">一次请求只先调用一个候选；按占用比例选择从第 3 课开始</text></g></svg>
